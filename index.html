<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f9f8f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DJ Fahim</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" href="index.pdf" as="fetch" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" as="fetch" crossorigin>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; background: #f9f8f6; }
        #viewer { position: relative; width: 100%; }
        #edgeTop, #edgeBottom { width: 100%; }
        #edgeTop { height: env(safe-area-inset-top, 0px); }
        #edgeBottom { height: env(safe-area-inset-bottom, 0px); }
        .page { position: relative; margin: 0 auto; overflow: hidden; line-height: 0; }
        .tile { position: absolute; left: 0; width: 100%; }
        .tile canvas { display: block; width: 100%; height: 100%; }
        .page a {
            position: absolute; display: block; z-index: 2;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }
        #status {
            position: fixed; top: 50%; left: 0; right: 0; z-index: 5;
            transform: translateY(-50%); text-align: center;
            font: 16px sans-serif; color: #555; pointer-events: none;
        }
        #fb { width: 100%; height: 100vh; border: 0; display: block; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="edgeTop"></div>
    <div id="viewer"></div>
    <div id="edgeBottom"></div>
    <div id="status">Loading…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const PDF_URL = 'index.pdf';
        const BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
        const TILE = 1000; // css-px per bildruta

        const viewer = document.getElementById('viewer');
        const statusEl = document.getElementById('status');
        let pdfDoc = null, gen = 0, busy = false, firstDone = false;
        let tiles = [], pageEls = [];

        function fallback() {
            gen++;
            statusEl.remove();
            viewer.innerHTML = '<iframe id="fb" src="' + PDF_URL + '"></iframe>';
        }

        async function goToDest(dest) {
            try {
                if (typeof dest === 'string') dest = await pdfDoc.getDestination(dest);
                if (!dest) return;
                const el = pageEls[await pdfDoc.getPageIndex(dest[0])];
                if (el) window.scrollTo({ top: el.offsetTop + viewer.offsetTop, behavior: 'smooth' });
            } catch (e) {}
        }

        function setEdge(which, canvas, y) {
            try {
                const d = canvas.getContext('2d').getImageData(canvas.width >> 1, y, 1, 1).data;
                const c = 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
                if (which === 'top') {
                    document.documentElement.style.background = c;
                    document.body.style.background = c;
                    document.getElementById('edgeTop').style.background = c;
                    document.getElementById('edgeBottom').style.background = c;
                    document.querySelector('meta[name=theme-color]').content = c;
                } else {
                    document.getElementById('edgeBottom').style.background = c;
                }
            } catch (e) {}
        }

        // Markerar vilka bitar som är nära skärmen
        function update() {
            const H = window.innerHeight, m = 1500;
            for (const t of tiles) {
                const r = t.div.getBoundingClientRect();
                t.want = r.bottom > -m && r.top < H + m;
            }
            pump(gen);
        }

        // Ritar bara de bitar som är nära skärmen, uppifrån och ner
        async function pump(g) {
            if (busy) return;
            busy = true;
            while (g === gen) {
                const t = tiles.find(t => t.want && !t.done);
                if (!t) break;
                t.done = true;
                try {
                    const c = document.createElement('canvas');
                    c.width = Math.ceil(t.vp.width * t.dpr);
                    c.height = Math.ceil(t.h * t.dpr);
                    await t.page.render({
                        canvasContext: c.getContext('2d'),
                        viewport: t.vp,
                        transform: [t.dpr, 0, 0, t.dpr, 0, -t.y0 * t.dpr]
                    }).promise;
                    if (g !== gen) break;
                    t.div.appendChild(c);
                    if (!firstDone) { firstDone = true; statusEl.remove(); }
                    if (t === tiles[0]) setEdge('top', c, 2);
                    if (t === tiles[tiles.length - 1]) setEdge('bottom', c, c.height - 3);
                } catch (e) { console.error(e); }
            }
            busy = false;
            if (g !== gen) pump(gen);
        }

        async function build() {
            const g = ++gen;
            const ratio = document.documentElement.scrollHeight > 0
                ? window.scrollY / document.documentElement.scrollHeight : 0;
            const width = viewer.clientWidth || window.innerWidth;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const newTiles = [], newEls = [];
            const container = document.createElement('div');

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                if (g !== gen) return;
                const base = page.getViewport({ scale: 1 });
                const vp = page.getViewport({ scale: width / base.width });

                const wrap = document.createElement('div');
                wrap.className = 'page';
                wrap.style.width = vp.width + 'px';
                wrap.style.height = vp.height + 'px';

                for (let y0 = 0; y0 < vp.height; y0 += TILE) {
                    const h = Math.min(TILE, vp.height - y0);
                    const div = document.createElement('div');
                    div.className = 'tile';
                    div.style.top = y0 + 'px';
                    div.style.height = h + 'px';
                    const t = { page, vp, y0, h, dpr, div, want: false, done: false };
                    div._t = t;
                    newTiles.push(t);
                    wrap.appendChild(div);
                }

                // Klickbara länkar direkt, öppnas i ny flik
                const anns = await page.getAnnotations();
                for (const ann of anns) {
                    if (ann.subtype !== 'Link') continue;
                    const [x1, y1, x2, y2] = vp.convertToViewportRectangle(ann.rect);
                    const a = document.createElement('a');
                    a.style.left = Math.min(x1, x2) + 'px';
                    a.style.top = Math.min(y1, y2) + 'px';
                    a.style.width = Math.abs(x2 - x1) + 'px';
                    a.style.height = Math.abs(y2 - y1) + 'px';
                    const url = ann.url || ann.unsafeUrl;
                    if (url) {
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                    } else if (ann.dest) {
                        a.href = '#';
                        a.addEventListener('click', (e) => { e.preventDefault(); goToDest(ann.dest); });
                    } else continue;
                    wrap.appendChild(a);
                }
                container.appendChild(wrap);
                newEls.push(wrap);
            }

            if (g !== gen) return;
            tiles = newTiles;
            pageEls = newEls;
            viewer.replaceChildren(container);
            window.scrollTo(0, ratio * document.documentElement.scrollHeight);
            update();
        }

        async function start() {
            try {
                if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js');
                // Hämta PDF och worker samtidigt
                const [workerText, buf] = await Promise.all([
                    fetch(BASE + 'pdf.worker.min.js').then(r => r.text()).catch(() => null),
                    fetch(PDF_URL).then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.arrayBuffer();
                    })
                ]);
                pdfjsLib.GlobalWorkerOptions.workerSrc = workerText
                    ? URL.createObjectURL(new Blob([workerText], { type: 'text/javascript' }))
                    : BASE + 'pdf.worker.min.js';
                pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
                await build();
            } catch (e) {
                console.error(e);
                fallback();
            }
        }

        let lastWidth = window.innerWidth, timer;
        window.addEventListener('resize', () => {
            if (window.innerWidth === lastWidth || !pdfDoc) return;
            lastWidth = window.innerWidth;
            clearTimeout(timer);
            timer = setTimeout(build, 250);
        });

        let ticking = false;
        window.addEventListener('scroll', () => {
            if (ticking || !tiles.length) return;
            ticking = true;
            requestAnimationFrame(() => { ticking = false; update(); });
        }, { passive: true });

        // Om inget hunnit visas efter 25 s: visa PDF:en direkt
        setTimeout(() => { if (!firstDone) fallback(); }, 25000);

        start();
    </script>
</body>
</html>
